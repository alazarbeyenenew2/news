# Production: deployed by .github/workflows/deploy.yml, which writes .env from GitHub secrets/variables.
# Manual run (local testing only):
#   cp .env.example .env   # fill it in
#   docker compose up -d --build                    # bot + admin page on 127.0.0.1:8000
#   docker compose --profile https up -d --build    # also serve the admin page over HTTPS at $DOMAIN
#
# Run only ONE copy of the bot: Telegram allows a single long-polling connection per token.
# Bot, collector, sender and admin page run in one process (a modular monolith); see README.
name: news-bot

services:
  # The database. POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB come from .env (GitHub secrets in
  # production). They're applied only when the data volume is first created: see README before changing them.
  # Not published on any host port; only the bot container can reach it.
  postgres:
    image: postgres:16.4-alpine
    container_name: news-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-newsbot}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: .
    image: news-bot:latest
    container_name: news-bot
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback only by default, so the admin page isn't exposed over plain HTTP.
      # Reach it through an SSH tunnel, the Caddy service below, or set ADMIN_BIND=0.0.0.0.
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-8000}:8000"
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional HTTPS reverse proxy with automatic Let's Encrypt certificates.
  # Needs DOMAIN in .env and the domain's DNS pointing at this server (ports 80/443 open).
  caddy:
    image: caddy:2.8.4-alpine
    container_name: news-bot-caddy
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - bot
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pg-data:
  caddy-data:
  caddy-config:
