{% extends "base.html" %}
{% block title %}Sign in · {{ bot_name }} Admin{% endblock %}
{% block header %}{% endblock %}
{% block content %}
<div class="card" style="max-width:360px;margin:10vh auto 0">
  <h1 style="margin-bottom:16px">{{ bot_name }} Admin</h1>
  {% if error %}<p style="color:var(--danger)">{{ error }}</p>{% endif %}
  <form method="post" action="/login" style="display:grid;gap:10px">
    <input name="username" placeholder="Username" autocomplete="username" required autofocus>
    <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="primary" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
