<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ bot_name }} Admin{% endblock %}</title>
  <style>
    :root {
      --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e5e7eb;
      --primary: #2563eb; --danger: #dc2626; --ok: #16a34a; --warn: #d97706;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1218; --card: #181c24; --text: #e6e8ee; --muted: #9aa3b2; --line: #2a303c; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: var(--bg); color: var(--text); }
    a { color: var(--primary); }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    h1 { font-size: 20px; margin: 0; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    nav { display: flex; gap: 4px; flex-wrap: wrap; }
    nav a { text-decoration: none; color: var(--text); padding: 6px 12px; border-radius: 7px; }
    nav a.on { background: var(--card); border: 1px solid var(--line); font-weight: 600; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
                   padding: 6px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; text-decoration: none; }
    button:hover { filter: brightness(0.96); }
    .primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
    .ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
    input, textarea, select { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px;
            background: var(--card); color: var(--text); }
    textarea { width: 100%; font-family: ui-monospace, monospace; font-size: 13px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 12px;
             background: color-mix(in srgb, var(--primary) 12%, transparent); }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat b { display: block; font-size: 24px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
    .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 600; margin: 1px 0; }
    .b-on { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
    .b-off { background: color-mix(in srgb, var(--muted) 15%, transparent); color: var(--muted); }
    .b-warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
    .b-bad { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
    .b-info { background: color-mix(in srgb, var(--primary) 15%, transparent); color: var(--primary); }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-start; }
    .actions form { margin: 0; }
    details summary { cursor: pointer; color: var(--muted); }
    .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    {% block header %}
    <header>
      <h1>📰 {{ bot_name }} Admin</h1>
      <nav>
        {% set path = request.url.path %}
        <a href="/" class="{{ 'on' if path == '/' }}">Overview</a>
        <a href="/categories" class="{{ 'on' if path == '/categories' }}">Topics</a>
        <a href="/articles" class="{{ 'on' if path == '/articles' }}">Articles</a>
        <a href="/notifications" class="{{ 'on' if path == '/notifications' }}">Failed alerts</a>
        <a href="/users" class="{{ 'on' if path == '/users' }}">Users</a>
      </nav>
      <form method="post" action="/logout"><button type="submit">Log out</button></form>
    </header>
    {% if msg %}<div class="flash">{{ msg }}</div>{% endif %}
    {% endblock %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
