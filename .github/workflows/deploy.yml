# Deploys the News Bot (bot + collector + sender + web admin page, optional Caddy HTTPS) to one server
# over SSH with Docker Compose.
#
# Runs on every push to main, or by hand: Actions -> Deploy -> Run workflow.
# The server needs Docker (usable by DEPLOY_USER without sudo), the Docker Compose plugin and rsync.
#
# Repository secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   DEPLOY_HOST          server IP or hostname                                           (required)
#   DEPLOY_USER          SSH user on the server                                          (required)
#   DEPLOY_SSH_KEY       private key whose public key is in that user's ~/.ssh/authorized_keys (required)
#   DEPLOY_KNOWN_HOSTS   output of `ssh-keyscan -H <host>`; pins the server's host key   (recommended)
#   BOT_TOKEN            token from @BotFather                                           (required)
#   ADMIN_PASSWORD       web admin page password                                         (required)
#   SECRET_KEY           random string that signs login cookies:
#                        python3 -c "import secrets; print(secrets.token_hex(32))"       (required)
#
# Repository variables (same page -> Variables):
#   SUPER_ADMIN_IDS      your Telegram user ID(s), comma separated                       (required)
#   DEPLOY_PORT (22), DEPLOY_PATH (news-bot, relative to the user's home),
#   BOT_NAME (NewsPulse), ADMIN_USERNAME (admin), TIMEZONE (Africa/Addis_Ababa),
#   CLASSIFY_MIN_CONFIDENCE (0.6), MAX_ARTICLE_AGE_HOURS (12), ARTICLE_RETENTION_DAYS (30),
#   DEFAULT_MAX_PER_DAY (30), MESSAGES_PER_SECOND (20),
#   DOMAIN       when set, also starts Caddy (`--profile https`) and serves the admin page at https://DOMAIN
#   ADMIN_BIND (127.0.0.1), ADMIN_PORT (8000)   where the plain-HTTP admin page is published on the server
#
# Every runtime setting comes from here: the workflow writes the server's .env on each deploy and
# overwrites any hand edits there. Setup steps: see "Deploy with GitHub Actions" in README.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and only one bot: Telegram allows a single polling connection per token.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # same as the Dockerfile
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q *.py
      - name: Tests
        run: python -m pytest -q
      - name: Docker image builds
        run: docker build -t news-bot:ci .
      - name: Compose file is valid
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile https config -q

  deploy:
    name: Deploy to server
    needs: check
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'news-bot' }}
      DOMAIN: ${{ vars.DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets and variables
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SUPER_ADMIN_IDS: ${{ vars.SUPER_ADMIN_IDS }}
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY BOT_TOKEN ADMIN_PASSWORD SECRET_KEY SUPER_ADMIN_IDS; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set."; missing=1; fi
          done
          [ "$missing" = 0 ]
          if ! [[ "$SUPER_ADMIN_IDS" =~ ^[0-9]+([[:space:]]*,[[:space:]]*[0-9]+)*$ ]]; then
            echo "::error::SUPER_ADMIN_IDS must be numeric Telegram IDs separated by commas."; exit 1
          fi
          if [ "${#SECRET_KEY}" -lt 32 ]; then
            echo "::warning::SECRET_KEY is shorter than 32 characters; use a long random string."
          fi

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS is not set; trusting whatever host key the server presents now."
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF
          ssh deploy 'command -v docker >/dev/null && docker compose version >/dev/null && docker info >/dev/null 2>&1 && command -v rsync >/dev/null' \
            || { echo "::error::The server needs docker (usable by $DEPLOY_USER without sudo), the docker compose plugin and rsync."; exit 1; }

      - name: Write .env from secrets and variables
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_NAME: ${{ vars.BOT_NAME || 'NewsPulse' }}
          SUPER_ADMIN_IDS: ${{ vars.SUPER_ADMIN_IDS }}
          ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME || 'admin' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Africa/Addis_Ababa' }}
          CLASSIFY_MIN_CONFIDENCE: ${{ vars.CLASSIFY_MIN_CONFIDENCE }}
          MAX_ARTICLE_AGE_HOURS: ${{ vars.MAX_ARTICLE_AGE_HOURS }}
          ARTICLE_RETENTION_DAYS: ${{ vars.ARTICLE_RETENTION_DAYS }}
          DEFAULT_MAX_PER_DAY: ${{ vars.DEFAULT_MAX_PER_DAY }}
          MESSAGES_PER_SECOND: ${{ vars.MESSAGES_PER_SECOND }}
          ADMIN_BIND: ${{ vars.ADMIN_BIND || '127.0.0.1' }}
          ADMIN_PORT: ${{ vars.ADMIN_PORT || '8000' }}
        run: |
          umask 077
          mkdir -p deploy-env
          if ! [[ "$ADMIN_BIND" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            echo "::error::ADMIN_BIND must be an IPv4 address such as 127.0.0.1 or 0.0.0.0 (got: $ADMIN_BIND)"; exit 1
          fi
          if ! [[ "$ADMIN_PORT" =~ ^[0-9]+$ ]]; then echo "::error::ADMIN_PORT must be a number."; exit 1; fi
          if [ -n "$DOMAIN" ] && ! [[ "$DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::DOMAIN must be a bare hostname like admin.example.com (no https://, no path)."; exit 1
          fi
          # KEY='value' lines, read by docker compose (quotes are stripped). Empty values are skipped,
          # so the app's defaults apply.
          for name in BOT_TOKEN BOT_NAME SUPER_ADMIN_IDS ADMIN_USERNAME ADMIN_PASSWORD SECRET_KEY TIMEZONE \
                      CLASSIFY_MIN_CONFIDENCE MAX_ARTICLE_AGE_HOURS ARTICLE_RETENTION_DAYS DEFAULT_MAX_PER_DAY \
                      MESSAGES_PER_SECOND ADMIN_BIND ADMIN_PORT DOMAIN; do
            value=${!name}
            [ -z "$value" ] && continue
            if [[ "$value" == *"'"* || "$value" == *$'\n'* ]]; then
              echo "::error::$name must not contain a single quote or a line break."; exit 1
            fi
            printf "%s='%s'\n" "$name" "$value" >> deploy-env/.env
          done

      - name: Copy code to the server
        run: |
          ssh deploy "mkdir -p '$DEPLOY_PATH'"
          # --delete removes files deleted from the repo; excluded paths (.env, data, backups) are left alone.
          rsync -az --delete \
            --exclude .git/ --exclude .github/ --exclude .venv/ --exclude __pycache__/ --exclude tests/ \
            --exclude .env --exclude data/ --exclude backups/ --exclude deploy-env/ \
            ./ "deploy:$DEPLOY_PATH/"
          rsync -z --chmod=F600 deploy-env/.env "deploy:$DEPLOY_PATH/.env"

      - name: Back up the database
        # Uses SQLite's online backup inside the running container; skipped on the first deploy.
        run: |
          ssh deploy "cd '$DEPLOY_PATH' && bash -s" <<'EOF'
          set -e
          if [ -z "$(docker compose ps -q --status running bot 2>/dev/null)" ]; then
            echo "Bot is not running yet; nothing to back up."; exit 0
          fi
          mkdir -p backups
          docker compose exec -T bot python -c "import sqlite3; sqlite3.connect('/app/data/news.db').backup(sqlite3.connect('/app/data/backup.db'))"
          name="backups/news-$(date -u +%Y%m%dT%H%M%SZ).db"
          docker compose cp bot:/app/data/backup.db "$name"
          echo "Saved $name"
          # Keep the 14 newest backups.
          ls -1t backups/news-*.db | tail -n +15 | xargs -r rm --
          EOF

      - name: Build and start
        run: |
          profile=""
          [ -n "$DOMAIN" ] && profile="--profile https"
          ssh deploy "cd '$DEPLOY_PATH' && docker compose $profile up -d --build --remove-orphans && docker image prune -f"

      - name: Health check
        run: |
          ssh deploy "cd '$DEPLOY_PATH' && docker compose ps"
          for i in $(seq 30); do
            if ssh deploy "cd '$DEPLOY_PATH' && docker compose exec -T bot python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)\"" 2>/dev/null; then
              echo "Bot, collector, sender and admin page are up."
              ssh deploy "cd '$DEPLOY_PATH' && docker compose logs --since 10m bot" | grep 'Bot started as' | tail -1
              exit 0
            fi
            sleep 2
          done
          echo "::error::The bot is not ready (check BOT_TOKEN, and that no other copy of the bot is polling)."
          ssh deploy "cd '$DEPLOY_PATH' && docker compose logs --tail 80 bot"
          exit 1

      - name: Remove key and env files from the runner
        if: always()
        run: rm -rf ~/.ssh/deploy_key deploy-env
